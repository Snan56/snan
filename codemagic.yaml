# Construit l'appli iPhone de Parcours sur un Mac de Codemagic et l'envoie sur TestFlight.
# Prérequis (une fois) : voir « Appli iPhone » dans le README.
workflows:
  iphone-testflight:
    name: Parcours iPhone (TestFlight)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Parcours        # nom de la clé API App Store Connect ajoutée dans Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: fr.snan56.parcours
      node: 22
      xcode: latest
      vars:
        PARCOURS_WEB: web
    scripts:
      - name: Installer les dépendances
        script: npm ci
      - name: Préparer la page web et le projet iPhone
        script: npm run build:www && npx cap sync ios
      - name: Numéro de build
        script: sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/" ios/App/App.xcodeproj/project.pbxproj
      - name: Signature
        script: xcode-project use-profiles
      - name: Construire l'appli
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
